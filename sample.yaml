axes:
  - id: cost
    name: Cost
    description: >-
      how expensive the option is (0 = Zero €, 100 = very expensive). Note: This should be seen as
      money that leaves your organisation to never be seen again. So, staff investments building
      in-house expertise not included.
    min: 0
    max: 100
  - id: user_friendly
    name: User friendly
    description: how easy it is to use (100 = very friendly)
    min: 0
    max: 100
  - id: many_options
    name: Many Functionalities
    description: >-
      how much functionalities the system offers. This tends to negatively influence User
      Friendlyness (0 = it can just do one thing (e.g. tick an 'accept/reject' box), 100 = Every
      possible spectrum information unit crammed into one interface)
    min: 0
    max: 100
  - id: ax_s8en3r
    name: Ecological
    description: ''
    min: 0
    max: 100
  - id: ax_t5pu1y
    name: Customizable
    description: How easy it is to customize workflows (0 = not at all, 100 = it's a lego box)
    min: 0
    max: 100
  - id: ax_rd9w6k
    name: Support
    description: >-
      quality of support from the service provider (0 = non existant, 100 = very good, but probably
      very expensive)
    min: 0
    max: 100
  - id: ax_7mm81h
    name: Sovereignty
    description: >-
      (own interpretation) How much you own your own data and the processes (0 = not at all, 100 =
      compare it to writing by hand in your own diary with a pen you paid for and own)
    min: 0
    max: 100
  - id: ax_k5j79a
    name: Security
    description: >-
      Web based applications, especially today, are targets of attack. How do you keep the bad guys
      out. Think of verification processes, IP limits, ... (0 = It's all online, anyone with the
      link can edit, 100 = it's all in a safe and only three people have a piece of the key to
      unlock it)
    min: 0
    max: 100
  - id: ax_7qsepf
    name: Usable data
    description: >-
      Not the same as Interoperable. How easy it is to access, use and transform the data (0 = in an
      encrypted obscure dataformat (e.g. pdf), 100 = accessible without the need for special
      software, understandable without the need of an expert)
    min: 0
    max: 100
  - id: ax_rt11hp
    name: Interoperable
    description: >-
      Based on shared standards. So it becomes interoperable (mostly for machines) (0 = no data
      model, 50 = own in house data model, 100 = well known data model, no dirty data)
    min: 0
    max: 100
